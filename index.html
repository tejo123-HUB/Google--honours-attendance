<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Google Cloud Honors Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <!-- SECTION SELECTION VIEW -->
        <div id="section-view">
            <header>
                <h1>Attendance Tracker</h1>
                <p>Select your <span class="highlight">Section</span></p>
            </header>
            <div id="section-grid" class="section-grid">
                <!-- Section buttons will be injected here -->
            </div>
        </div>

        <!-- ATTENDANCE VIEW -->
        <div id="attendance-view" class="hidden">
            <header style="padding-bottom: 1rem;">
                <h1 id="current-section-title">CSE-4</h1>
                <p>Select students who are <span class="highlight">absent</span></p>
            </header>

            <div class="list-header">
                <button id="back-btn" class="btn tertiary-btn back-btn" style="padding: 0.5rem 1rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Back
                </button>
                <div class="count-display">
                    <span>Absent:</span> 
                    <span class="highlight-count" id="absent-count">0</span>
                    <span style="font-size:0.8rem; opacity:0.6; margin-left:4px;">/ <span id="total-count">0</span></span>
                </div>
                <button id="generate-btn" class="btn primary-btn" style="padding: 0.5rem 1rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    <span class="desktop-only">Generate</span>
                </button>
            </div>
            
            <main id="student-list" class="student-list">
                <!-- Students will be dynamically injected here -->
            </main>
        </div>
    </div>

    <!-- Modal for Result -->
    <div id="report-modal" class="modal hidden">
        <div class="modal-content">
            <div class="mobile-drag-handle"></div>
            <h2>Attendance Report</h2>
            <textarea id="report-output" readonly></textarea>
            <div class="modal-actions">
                <button id="close-btn" class="btn tertiary-btn">Close</button>
                <button id="copy-btn" class="btn secondary-btn">Copy</button>
            </div>
        </div>
    </div>

    <!-- Load external data first -->
    <script src="data.js"></script>
    <!-- Load main logic -->
    <script src="app.js"></script>
</body>
</html>
